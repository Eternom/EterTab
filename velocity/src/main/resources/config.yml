# ============================================================
#  EterTab (Velocity) : liste Tab de tout le réseau
# ============================================================
#
#  Chaque joueur voit dans le Tab tous les joueurs du réseau, quel que soit
#  leur serveur, avec leur grade LuckPerms (s'il est installé sur le proxy),
#  triés par grade. Les textes de l'en-tête et du pied sont dans lang/.
#  Toute modification nécessite un redémarrage du proxy.

# Langue utilisée si celle du joueur n'existe pas dans lang/.
default-language: en_us

# Rafraîchissement de la liste et des animations, en millisecondes.
update-interval: 1000

# Heure et date affichées (<time>, <date>).
time-zone: Europe/Paris
time-format: "HH:mm"
date-format: "dd/MM/yyyy"

# Palette des messages : à garder identique à EterLib/config.yml (language.colors).
colors:
  primary: '#FF7A00'   # titres
  accent: '#FFA640'    # mots importants
  info: gray           # texte courant (gris clair)
  error: '#FF5C5C'
  success: '#5FD38D'

tab:
  # Nom d'un joueur dans la liste. Variables : <prefix> <suffix> (grade LuckPerms, espace ajoutée
  # automatiquement), <name>, <group>, <server> (nom affiché), et <tag_...> : étiquettes posées par les
  # plugins Paper (vides si absentes), ex : <tag_job> = métier et quêtes dispo (EterMarket, plutôt dans la sidebar).
  # Joueur sur le même serveur que celui qui regarde :
  player-format: "<prefix><white><name></white><suffix>"
  # Joueur sur un autre serveur : on indique où il est.
  player-format-other-server: "<prefix><white><name></white><suffix> <#8A8A8A>· <info><server>"
  # Trier par poids du grade LuckPerms (les plus hauts en premier), sinon ordre de Minecraft.
  sort-by-rank: true

# Animations, utilisables dans tous les textes avec <anim_<nom>> (ex : <anim_logo>).
# interval : durée d'une image en millisecondes ; frames : les images, en MiniMessage.
animations:
  logo:
    interval: 120
    frames:
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:-1.0>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:-0.8>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:-0.6>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:-0.4>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:-0.2>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:0.0>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:0.2>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:0.4>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:0.6>E T E R N O M</gradient></bold>"
      - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00:0.8>E T E R N O M</gradient></bold>"

# ============================================================
#  MOTD : ce qu'affiche la liste des serveurs du jeu
# ============================================================
#
#  En config et pas dans lang/ : le jeu n'envoie pas sa langue quand il interroge un serveur.
#  Une ligne fait environ 45 caractères ; <newline> passe à la deuxième ligne.
#  Variables : <online> <max>, et les animations (<anim_logo>...). /etertab reload pour appliquer.

motd:
  enabled: true
  # random : un message au hasard à chaque rafraîchissement de la liste ; rotate : chacun son tour.
  mode: rotate
  rotate-seconds: 10
  messages:
    - "           <bold><gradient:#FF7A00:#FFE0B2:#FF7A00>E T E R N O M</gradient></bold><newline><info>     Survie multi-serveurs <#8A8A8A>|</#8A8A8A> <accent>Rejoins-nous !"
    - "           <bold><gradient:#FF7A00:#FFE0B2:#FF7A00>E T E R N O M</gradient></bold><newline><info>  Homes, inventaire synchronisé et économie"
  # Maximum affiché ; 0 = toujours un de plus que les joueurs en ligne.
  max-players: 500
  # Lignes au survol du nombre de joueurs, puis la liste des joueurs connectés.
  hover:
    - "<primary><bold>Eternom</bold>"
    - "<info>Survie multi-serveurs"
    - ""
  hover-show-players: true
  hover-max-players: 10
  hover-player: "<#8A8A8A>• <white><name>"
  hover-more: "<info>... et <accent><count></accent> autres"
  # Texte de version (s'affiche quand la version du joueur n'est pas compatible). Vide : celui de Velocity.
  version-name: ""
  # Icône : PNG de 64x64 pixels déposé dans plugins/etertab/. Vide : celle de Velocity (server-icon.png).
  favicon: ""

# ============================================================
#  Maintenance : /etertab maintenance on|off
# ============================================================
#
#  Seuls les joueurs avec la permission etertab.maintenance.bypass peuvent se connecter ;
#  les autres sont renvoyés (message dans lang/). L'état est gardé dans maintenance.yml.

maintenance:
  motd:
    - "           <bold><gradient:#FF7A00:#FFE0B2:#FF7A00>E T E R N O M</gradient></bold><newline><error>   Maintenance en cours <#8A8A8A>|</#8A8A8A> <info>reviens vite !"
  hover:
    - "<error>Maintenance en cours"
    - "<info>Suis l'avancement sur discord.gg/eternom"
  # Remplace les barres de signal pendant la maintenance.
  version-name: "<error>Maintenance"
