# Messages d'EterTab (Velocity), format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (config.yml > colors) : <primary> <accent> <info> <error> <success>
# Animations de config.yml : <anim_logo>, <anim_dots>...
# Variables de l'en-tête et du pied : <player> <online> <max> <server> <server_online> <ping> <time> <date> <servers>
# Une liste = une ligne par élément. Une clé absente reprend le texte intégré au plugin.

tab:
  header:
    - ""
    - "<anim_logo>"
    - "<info>Bienvenue, <accent><player></accent> !"
    - ""
  footer:
    - ""
    - "<info>En ligne <accent><online></accent><dark_gray>/</dark_gray><accent><max></accent> <dark_gray>·</dark_gray> <info>Serveur <accent><server></accent> <dark_gray>·</dark_gray> <info>Ping <accent><ping>ms"
    - "<servers>"
    - ""
    - "<anim_dots> <info>discord.gg/eternom <dark_gray>·</dark_gray> <info>eternom.fr <dark_gray>·</dark_gray> <accent><time></accent> <anim_dots>"
    - ""
  # Un serveur dans <servers> : <name> et <count> (joueurs dessus)
  server-entry: "<info><name> <accent><count>"
  server-separator: " <dark_gray>·</dark_gray> "
