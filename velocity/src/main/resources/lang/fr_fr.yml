# Messages d'EterTab (Velocity), format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (config.yml > colors) : <primary> <accent> <info> <error> <success>
# Animations de config.yml : <anim_logo>...
# Variables de l'en-tête et du pied : <player> <online> <max> <server> <server_online> <ping> <time> <date>
#   <servers> = les serveurs qui ont des joueurs, avec leur nombre (utile à partir de 2 serveurs).
# Évite <dark_gray> ici : presque invisible sur le fond du Tab ; préfère <#8A8A8A> pour les séparateurs.
# Une liste = une ligne par élément. Une clé absente reprend le texte intégré au plugin.

tab:
  header:
    - ""
    - "<anim_logo>"
    - "<info>Bienvenue <white><player></white>"
    - ""
  footer:
    - ""
    - "<info>Joueurs <accent><online></accent>   <#8A8A8A>|</#8A8A8A>   <info>Serveur <accent><server></accent>   <#8A8A8A>|</#8A8A8A>   <info>Ping <accent><ping>ms"
    - ""
    - "<info>discord.gg/eternom   <#8A8A8A>|</#8A8A8A>   <info>eternom.fr"
    - ""
  # Un serveur dans <servers> : <name> (nom affiché) et <count> (joueurs dessus)
  server-entry: "<info><name> <accent><count>"
  server-separator: "   <#8A8A8A>|</#8A8A8A>   "


command:
  usage: '<error>Utilisation : <accent>/etertab reload</accent> <info>ou <accent>/etertab maintenance on|off|status'
  reloaded: "<info>Configuration et langues rechargées."
  reload-failed: "<error>Configuration illisible : rien n'a été changé. Détails dans la console du proxy."

maintenance:
  enabled: "<info>Maintenance <accent>activée</accent> : seuls les joueurs autorisés peuvent se connecter."
  disabled: "<info>Maintenance <accent>désactivée</accent> : le réseau est ouvert à tous."
  status-on: "<info>La maintenance est <accent>activée</accent>."
  status-off: "<info>La maintenance est <accent>désactivée</accent>."
  save-failed: "<error>Impossible d'enregistrer l'état de la maintenance (voir la console)."
  # Message affiché aux joueurs renvoyés (une liste = plusieurs lignes)
  kick:
    - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00>E T E R N O M</gradient></bold>"
    - ""
    - "<error>Le serveur est en maintenance."
    - "<info>Reviens dans quelques instants !"
    - ""
    - "<info>Infos : <accent>discord.gg/eternom"
