# EterTab (Velocity) messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (config.yml > colors): <primary> <accent> <info> <error> <success>
# Animations from config.yml: <anim_logo>...
# Header/footer variables: <player> <online> <max> <server> <server_online> <ping> <time> <date>
#   <servers> = servers that have players, with their count (useful from 2 servers on).
# Avoid <dark_gray> here: almost invisible on the Tab background; prefer <#8A8A8A> for separators.
# A list = one line per item. A missing key falls back to the plugin's built-in text.

tab:
  header:
    - ""
    - "<anim_logo>"
    - "<info>Welcome <white><player></white>"
    - ""
  footer:
    - ""
    - "<info>Players <accent><online></accent>   <#8A8A8A>|</#8A8A8A>   <info>Server <accent><server></accent>   <#8A8A8A>|</#8A8A8A>   <info>Ping <accent><ping>ms"
    - ""
    - "<info>discord.gg/eternom   <#8A8A8A>|</#8A8A8A>   <info>eternom.fr"
    - ""
  # One server in <servers>: <name> (display name) and <count> (players on it)
  server-entry: "<info><name> <accent><count>"
  server-separator: "   <#8A8A8A>|</#8A8A8A>   "

prefix: "<gradient:#FF7A00:#FFB347><bold>EterTab</bold></gradient> <dark_gray>» "

command:
  usage: '<error>Usage: <accent>/etertab reload</accent> <info>or <accent>/etertab maintenance on|off|status'
  reloaded: "<info>Configuration and languages reloaded."
  reload-failed: "<error>Configuration unreadable: nothing was changed. Details in the proxy console."

maintenance:
  enabled: "<info>Maintenance <accent>enabled</accent>: only allowed players can join."
  disabled: "<info>Maintenance <accent>disabled</accent>: the network is open to everyone."
  status-on: "<info>Maintenance is <accent>enabled</accent>."
  status-off: "<info>Maintenance is <accent>disabled</accent>."
  save-failed: "<error>Could not save the maintenance state (see the console)."
  # Message shown to players sent away (a list = several lines)
  kick:
    - "<bold><gradient:#FF7A00:#FFE0B2:#FF7A00>E T E R N O M</gradient></bold>"
    - ""
    - "<error>The server is under maintenance."
    - "<info>Come back in a moment!"
    - ""
    - "<info>More info: <accent>discord.gg/eternom"
