# EterTab (Paper) messages, MiniMessage format: https://docs.advntr.dev/minimessage/format
# Palette tags (EterLib/config.yml > language.colors): <primary> <accent> <info> <error> <success>
# Animations from config.yml: <anim_logo>...
# Variables: <player> <rank> <suffix> <group> <balance> <server> <online> <max> <network> <ping>
#            <world> <x> <y> <z> <time> <date>, and %placeholders% from PlaceholderAPI if installed.
# sidebar.lines: one line per item (15 max). A missing key falls back to the plugin's built-in text.

sidebar:
  title: "<anim_logo>"
  lines:
    - "<dark_gray><date> · <time>"
    - ""
    - "<accent><player>"
    - " <dark_gray>▸ <info>Rank <rank>"
    - " <dark_gray>▸ <info>Money <accent><balance>"
    - ""
    - "<accent>Server"
    - " <dark_gray>▸ <info>Name <accent><server>"
    - " <dark_gray>▸ <info>Online <accent><online></accent><dark_gray>/</dark_gray><accent><network>"
    - " <dark_gray>▸ <info>Ping <accent><ping>ms"
    - ""
    - "<primary>eternom.fr"
