# Messages d'EterTab (Paper), format MiniMessage : https://docs.advntr.dev/minimessage/format
# Balises de la palette (EterLib/config.yml > language.colors) : <primary> <accent> <info> <error> <success>
# Animations de config.yml : <anim_logo>...
# Variables : <player> <rank> <suffix> <group> <balance> <server> <online> <max> <network> <ping>
#             <world> <x> <y> <z> <time> <date>, et les %variables% de PlaceholderAPI s'il est installé.
# Évite <dark_gray> ici : presque invisible sur le fond de la sidebar ; préfère <#8A8A8A>.
# sidebar.lines : une ligne par élément (15 max). Une clé absente reprend le texte intégré au plugin.

sidebar:
  title: "<anim_logo>"
  lines:
    - ""
    - "<accent>● <white><player>"
    - "  <info>Grade <rank>"
    - "  <info>Argent <accent><balance>"
    - ""
    - "<accent>● <white>Réseau"
    - "  <info>Serveur <white><server>"
    - "  <info>Joueurs <white><network>"
    - "  <info>Ping <white><ping>ms"
    - ""
    - "<#8A8A8A>eternom.fr"
