name: EterTab
version: '${version}'

main: fr.eternom.eterTab.paper.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: Sidebar et grade au-dessus de la tête (la liste Tab du réseau est gérée par EterTab-Velocity).
depend: [EterLib]
softdepend: [Vault, EterEconomy, PlaceholderAPI]

commands:
  sidebar:
    description: Masque ou réaffiche ta sidebar (sur tous les serveurs).
    usage: /sidebar
    aliases: [sb]
    permission: etertab.sidebar.toggle

permissions:
  etertab.sidebar.toggle:
    description: Masquer ou réafficher sa sidebar.
    default: true
